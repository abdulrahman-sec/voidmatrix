name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binaries
        run: |
          mkdir -p build
          # Build Linux Binary
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/voidmatrix .
          # Build Windows Binary
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/voidmatrix.exe .
          # Build macOS (Intel) Binary
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/voidmatrix-macos-intel .
          # Build macOS (Apple Silicon) Binary
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/voidmatrix-macos-arm64 .

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/voidmatrix
            build/voidmatrix.exe
            build/voidmatrix-macos-intel
            build/voidmatrix-macos-arm64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
